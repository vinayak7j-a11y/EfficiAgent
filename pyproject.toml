# Project: EfficiAgent
# (No [project] table here on purpose: Vercel's Python builder runs
# `uv lock` against this file, which treats [project] as real packaging
# metadata and requires fields like `version`. This repo isn't a
# distributable package, so we skip it entirely and rely on requirements.txt.)

[tool.ruff]
line-length = 100
exclude = ["part1_token_optimization/*", "part2_debugging/*"]

[tool.ruff.lint]
# Default rule set (pycodestyle + pyflakes) is enough signal for this repo;
# the extended rule sets (PERF, BLE, etc.) are useful in a real codebase but
# not the focus of this exercise, so kept out of scope here deliberately.
select = ["E", "F", "W"]
