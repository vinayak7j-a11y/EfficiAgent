[project]
name = "efficiagent"

[tool.ruff]
line-length = 100
exclude = ["part1_token_optimization/*", "part2_debugging/*"]

[tool.ruff.lint]
# Default rule set (pycodestyle + pyflakes) is enough signal for this repo;
# the extended rule sets (PERF, BLE, etc.) are useful in a real codebase but
# not the focus of this exercise, so kept out of scope here deliberately.
select = ["E", "F", "W"]
